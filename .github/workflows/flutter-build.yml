name: Flutter Build (reusable)

# Workflow riusabile per le build Flutter: di norma sul runner self-hosted `nexus-core`
# (ARM64), a scelta (`runner: github`) su un runner x86-64 di GitHub; iOS solo su un
# runner macOS di GitHub.
# Chiamato dai thin wrapper dei progetti via:
#   uses: GabryXnLab/flutter-ci/.github/workflows/flutter-build.yml@main
#
# Produce un APK, un AAB, un bundle Linux desktop o un IPA iOS non firmato, lo carica come artifact del run
# e lo manda nel topic Telegram indicato. Tutta la logica sta qui: nei progetti
# restano solo le scelte.

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nome app (es. Kagami) — usato per il nome dell artifact e per la notifica Telegram'
        required: true
        type: string
      runner:
        description: >-
          self-hosted = nexus-core (default: SDK, pub cache e Gradle già caldi, nessun minuto
          Actions) | github = ubuntu-latest, quando nexus-core non deve prendere altro carico.
          Su GitHub l SDK Flutter si scarica (x86-64, niente QEMU) e la chiave di firma
          arriva dai secret ANDROID_KEYSTORE* (o ANDROID_DEBUG_KEYSTORE).
        required: false
        default: 'self-hosted'
        type: string
      flutter_version:
        description: >-
          Solo con runner=github: la versione Flutter da scaricare (es. 3.47.4), la stessa del
          clone sul runner self-hosted. Vuoto = l ultima stable.
        required: false
        default: ''
        type: string
      platform:
        description: >-
          android = APK/AAB per il telefono | linux = bundle desktop ARM64 (utile per provare la
          UI senza telefono) | ios = IPA non firmato da installare con AltStore o Sideloadly,
          solo con runner=github (macos-latest).
        required: false
        default: 'android'
        type: string
      artifact:
        description: 'Solo per platform=android: apk (sideload) | aab (Play Store)'
        required: false
        default: 'apk'
        type: string
      build_mode:
        description: 'debug | profile | release. Il release Flutter è AOT + tree-shaking: è quello che va sul telefono.'
        required: false
        default: 'release'
        type: string
      target_platform:
        description: >-
          ABI Android da compilare, separate da virgola (es. android-arm64,android-arm).
          Vuoto = tutte quelle di default di Flutter. Un telefono moderno è android-arm64:
          limitarsi a quella dimezza il peso dell APK e il tempo di compilazione AOT.
        required: false
        default: 'android-arm64'
        type: string
      split_per_abi:
        description: 'Un APK per ABI invece di uno universale. Ha senso solo con più ABI in target_platform.'
        required: false
        default: false
        type: boolean
      build_name:
        description: 'Sovrascrive il versionName (default: quello di pubspec.yaml)'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Sovrascrive il versionCode (default: quello di pubspec.yaml)'
        required: false
        default: ''
        type: string
      dart_defines:
        description: '--dart-define aggiuntivi, separati da spazio (es. "API=prod FLAG=true"). Vuoto = nessuno.'
        required: false
        default: ''
        type: string
      run_build_runner:
        description: >-
          Esegue `dart run build_runner build --delete-conflicting-outputs` prima della build.
          Serve ai progetti con codice generato (drift, json_serializable, …) che NON committano
          i `.g.dart`. Chi li committa lo lascia spento: rigenerarli in CI produrrebbe solo
          differenze non committate.
        required: false
        default: false
        type: boolean
      run_analyze:
        description: 'Esegue `flutter analyze` prima di compilare. Una segnalazione ferma la build.'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Esegue `flutter test` prima di compilare. Un test rosso ferma la build.'
        required: false
        default: true
        type: boolean
      max_workers:
        description: >-
          Worker di Gradle (e di CMake) per questo run. auto = sul self-hosted le CPU libere in
          quel momento, mai sotto 2; su GitHub tutte | 2 | 4. Stesso input, stessi valori e
          stesso significato in flutter-ci, expo-ci e desktop-ci (GabryXnLab/build-kit).
        required: false
        default: 'auto'
        type: string
      clear_cache:
        description: >-
          Svuota build/, .dart_tool/ e gli intermedi Gradle/Kotlin del progetto e, per questo run,
          non prende risultati dalla build cache. Le cache condivise con gli altri progetti
          (~/.gradle, pub-cache, ccache) non si cancellano.
        required: false
        default: false
        type: boolean
      has_submodules:
        description: 'true → checkout con submodules: recursive'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Ref/SHA da checkoutare. Vuoto = github.sha del run. Serve quando un job precedente ha committato nello stesso run.'
        required: false
        default: ''
        type: string
      prepare_command:
        description: 'Comando opzionale eseguito dopo `flutter pub get` e prima della build. Ha GITHUB_TOKEN disponibile.'
        required: false
        default: ''
        type: string
      flutter_sdk:
        description: >-
          Percorso dell SDK Flutter sul runner. ⚠️ Non si scarica l SDK in CI: su questa
          macchina ARM64 la tarball ufficiale (solo x86-64) muore sotto QEMU, quindi l SDK
          è un clone git già presente. Vedi README.
        required: false
        default: '/home/ubuntu/sdk/flutter'
        type: string
      x86_emulator:
        description: >-
          Come eseguire `gen_snapshot` x86-64 sul runner ARM64 (vedi lo step «gen_snapshot per
          host ARM64»): box64 (default: due esecuzioni Box64 in parallelo, accettate solo se
          concordi, altrimenti QEMU; ~46 s invece di ~5 min) | qemu (solo QEMU 10).
        required: false
        default: 'box64'
        type: string
      qemu_x86_64:
        description: 'Non più usato: il percorso di QEMU lo decide GabryXnLab/build-kit (x86-64). Resta per i wrapper che lo passano.'
        required: false
        default: '/home/ubuntu/qemu-x86_64-10/bin/qemu-x86_64'
        type: string
      qemu_deb_url:
        description: >-
          Pacchetto da cui estrarre quel QEMU. ⚠️ La 8.2 di Ubuntu 24.04 NON va: cade con
          «QEMU internal SIGSEGV» dentro gen_snapshot. Qui si usa la 10 di Debian trixie,
          estratta con dpkg-deb (nessuna installazione di sistema).
        required: false
        default: 'https://deb.debian.org/debian/pool/main/q/qemu/qemu-user_10.0.13+ds-0+deb13u1_arm64.deb'
        type: string
      android_sdk:
        description: 'ANDROID_HOME del runner. È condiviso con altri servizi della macchina: il workflow non ci installa niente.'
        required: false
        default: '/opt/android-sdk'
        type: string
      java_home:
        description: 'JDK usato da Gradle.'
        required: false
        default: '/usr/lib/jvm/java-17-openjdk-arm64'
        type: string
      artifact_retention_days:
        description: 'Giorni di conservazione dell artifact del run.'
        required: false
        default: 7
        type: number
      telegram_topic_id:
        description: 'Topic del supergruppo Telegram (message_thread_id). Vuoto = nessuna notifica.'
        required: false
        default: ''
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      # PAT read-only Contents per submodule privati cross-repo: il GITHUB_TOKEN di
      # default è scoped al solo repo in build. Se assente → github.token.
      SUBMODULES_TOKEN:
        required: false
      # La chiave con cui firmare l APK/AAB release, in base64 (`base64 -w0 <file>`), su
      # qualunque runner. Arriva a Gradle da android/key.properties, che il build.gradle del
      # progetto deve leggere (lo schema della documentazione di Flutter): il workflow
      # controlla dopo la build che la firma sia davvero quella. Senza, sul self-hosted si
      # firma come oggi con la chiave della macchina.
      ANDROID_KEYSTORE:
        required: false
      # Vuoti = quelli di una chiave di debug: `android`, `androiddebugkey`, e la password
      # della chiave uguale a quella del keystore.
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      # Solo con runner=github e senza ANDROID_KEYSTORE: il debug.keystore di nexus-core in
      # base64, per i chiamanti che lo passano già. Un runner GitHub ne genererebbe uno nuovo
      # a ogni build: l APK non si installerebbe sopra quello del telefono e Google Sign-In
      # rifiuterebbe l impronta.
      ANDROID_DEBUG_KEYSTORE:
        required: false
      # Il google-services.json del progetto Firebase di chi compila (solo platform=android):
      # scritto in android/app/ e tolto a fine job. Vuoto = nessun file, come oggi.
      GOOGLE_SERVICES_JSON:
        required: false
      # Come l input dart_defines, per i valori che non vanno scritti nel wrapper (es.
      # "SENTRY_DSN=https://…"): in `with:` il contesto secrets non c'è.
      DART_DEFINES:
        required: false

jobs:
  build:
    name: ${{ inputs.app_name }} · ${{ inputs.platform }} ${{ inputs.build_mode }}${{ inputs.split_per_abi && ' · per ABI' || '' }}
    # iOS con self-hosted resta sul self-hosted e si ferma al primo step: un runner macOS
    # costa dieci volte i minuti di uno Linux, e non va acceso solo per dire l errore.
    runs-on: ${{ inputs.runner == 'github' && (inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest') || fromJSON('["self-hosted", "nexus-core"]') }}
    steps:
      # «In corso» con ⏹ Annulla; lo step finale riscrive lo stesso messaggio. Senza i secret
      # di Telegram (repo pubblico, fork) l azione non manda niente.
      - name: Notify start via Telegram
        id: started
        uses: GabryXnLab/build-kit/notify@main
        with:
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: started
          title: ${{ inputs.app_name }} ${{ inputs.platform }} ${{ inputs.build_mode }}

      - name: Check inputs
        env:
          PLATFORM: ${{ inputs.platform }}
          RUNNER_KIND: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            android|linux) ;;
            ios)
              if [ "$RUNNER_KIND" != "github" ]; then
                echo "::error::platform=ios compila solo su macOS: serve runner=github (macos-latest). Il self-hosted è Linux."
                exit 1
              fi ;;
            *) echo "::error::platform non valida: '$PLATFORM' (attese: android | linux | ios)"; exit 1 ;;
          esac

      # Sul self-hosted il checkout non pulisce: `git clean -ffdx` toglieva build/,
      # .dart_tool/, android/.gradle e android/.kotlin, e ogni run ricompilava da zero
      # Kotlin e Java di tutti i plugin, il nativo e R8 (su Kagami ~5 minuti dopo la
      # compilazione Dart). Tenerli rende Gradle incrementale: riusa un risultato solo
      # se gli input sono identici, quindi l APK non cambia. `clear_cache` resta la via
      # per ripartire puliti. Un runner GitHub è comunque nuovo a ogni job.
      - uses: actions/checkout@v4
        with:
          clean: ${{ inputs.runner == 'github' }}
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.has_submodules && 'recursive' || 'false' }}
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      # L'SDK non si scarica: si verifica che ci sia e lo si mette in PATH per
      # tutti gli step successivi. Se manca, il job deve dirlo subito e chiaro,
      # non fallire fra venti minuti su un comando non trovato.
      # Sul self-hosted l ambiente punta all SDK Android condiviso, al JDK e alla pub cache
      # della macchina. Si scrive qui e non a livello di job: su GitHub quelle variabili
      # hanno già i valori giusti del runner, e un `env:` di job non si può omettere a
      # condizione. PUB_CACHE fissa: senza, Flutter userebbe $HOME del runner e due job
      # concorrenti si contenderebbero lo stesso file.
      - name: Configure self-hosted environment
        if: ${{ inputs.runner != 'github' }}
        env:
          ANDROID_SDK: ${{ inputs.android_sdk }}
          JAVA: ${{ inputs.java_home }}
        run: |
          set -euo pipefail
          {
            echo "ANDROID_HOME=$ANDROID_SDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK"
            echo "JAVA_HOME=$JAVA"
            echo "PUB_CACHE=/home/ubuntu/.pub-cache"
          } >> "$GITHUB_ENV"

      - name: Set up Java (GitHub runner)
        if: ${{ inputs.runner == 'github' && inputs.platform != 'ios' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Su un runner x86-64 (e sul macOS di GitHub) la tarball ufficiale va bene: il divieto
      # di scaricare l SDK vale solo per nexus-core, che è Linux ARM64.
      - name: Set up Flutter (GitHub runner)
        if: ${{ inputs.runner == 'github' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          # SDK e pub cache: il download dell SDK era un minuto a ogni run.
          cache: true

      # Dipendenze e risultati di Gradle da un run all altro: senza, ogni build scarica AGP,
      # Kotlin e tutte le librerie Android (quattro minuti nel primo run).
      - name: Gradle cache (GitHub runner)
        if: ${{ inputs.runner == 'github' && inputs.platform == 'android' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Il runner standard di un repo privato ha 2 CPU e 7 GB: i progetti tarano Gradle su
      # nexus-core (Kagami chiede 8 GB di heap e 4 di Metaspace), e con il demone Kotlin
      # accanto la macchina finiva la memoria e GitHub spegneva il runner a metà build
      # (run 36252509943: «received a shutdown signal», Gradle uscito con 143). Il
      # gradle.properties dell utente prevale su quello del progetto, e cambia solo la
      # memoria dei processi: l APK è lo stesso. Sopra i 12 GB (runner dei repo pubblici)
      # restano i valori del progetto. Lo swap è la rete sotto: meglio lento che spento.
      - name: Fit Gradle to the runner (GitHub runner)
        if: ${{ inputs.runner == 'github' && inputs.platform == 'android' }}
        run: |
          set -euo pipefail
          CPUS=$(nproc)
          MEM_GB=$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1024 / 1024 ))
          echo "Runner: $CPUS CPU, ${MEM_GB} GB di RAM"
          df -h / /mnt 2>/dev/null || df -h /
          # Il disco del runner è piccolo (run 36681640161: «No space left on device» a metà
          # build, con 8 GB di swap sullo stesso disco): via i toolchain preinstallati che una
          # build Flutter non usa. Il runner è usa e getta, e rm costa pochi secondi.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/julia* /usr/share/swift
          # Lo swap va dove c'è più spazio, e mai oltre metà di quello libero.
          if [ -z "$(swapon --show --noheadings)" ] || [ "$MEM_GB" -lt 12 ]; then
            DIR=/mnt
            FREE_MNT=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
            FREE_ROOT=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
            if [ "${FREE_MNT:-0}" -lt "$FREE_ROOT" ]; then DIR=$HOME; fi
            FREE=$(df -BG --output=avail "$DIR" | tail -1 | tr -dc 0-9)
            SWAP=$(( FREE / 2 < 8 ? FREE / 2 : 8 ))
            if [ "$SWAP" -ge 2 ]; then
              sudo fallocate -l "${SWAP}G" "$DIR/flutter-ci.swap"
              sudo chmod 600 "$DIR/flutter-ci.swap"
              sudo mkswap "$DIR/flutter-ci.swap" >/dev/null
              sudo swapon "$DIR/flutter-ci.swap"
            fi
          fi
          swapon --show
          df -h / /mnt 2>/dev/null || df -h /
          if [ "$MEM_GB" -lt 12 ]; then
            mkdir -p "$HOME/.gradle"
            {
              echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
              echo "kotlin.daemon.jvmargs=-Xmx1536m"
              echo "org.gradle.workers.max=$CPUS"
            } >> "$HOME/.gradle/gradle.properties"
            cat "$HOME/.gradle/gradle.properties"
          fi

      - name: Linux desktop dependencies (GitHub runner)
        if: ${{ inputs.runner == 'github' && inputs.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      # La chiave arriva a Gradle da android/key.properties, la convenzione di Flutter per la
      # firma. Scriverla in ~/.android/debug.keystore non basta: sui runner di GitHub Gradle
      # la ignora e ne genera una nuova (verificato su Kagami con apksigner, SHA-1 diversa da
      # quella del secret). Il keystore sta in RUNNER_TEMP, che il runner svuota a ogni job;
      # key.properties si toglie a fine job, perché sul self-hosted il checkout resta.
      - name: Signing key
        id: signing
        if: ${{ inputs.platform == 'android' }}
        env:
          RUNNER_KIND: ${{ inputs.runner }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] && [ "$RUNNER_KIND" = "github" ]; then KEYSTORE=$DEBUG_KEYSTORE; fi
          if [ -z "$KEYSTORE" ]; then
            if [ "$RUNNER_KIND" = "github" ]; then
              echo "::warning::Né ANDROID_KEYSTORE né ANDROID_DEBUG_KEYSTORE: APK firmato con una chiave nuova, che non si installa sopra quella del telefono e che Google Sign-In non riconosce."
            fi
            exit 0
          fi
          STORE="$RUNNER_TEMP/signing.keystore"
          printf '%s' "$KEYSTORE" | base64 -d > "$STORE"
          STORE_PASSWORD=${STORE_PASSWORD:-android}
          KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}
          KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}
          {
            echo "storeFile=$STORE"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "written=true" >> "$GITHUB_OUTPUT"
          CERT=$("${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -list -v -keystore "$STORE" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" || true)
          SHA1=$(awk '/SHA1:/ {print $2; exit}' <<< "$CERT")
          SHA256=$(awk '/SHA256:/ {print $2; exit}' <<< "$CERT")
          if [ -z "$SHA256" ]; then
            echo "::error::Nel keystore non c'è la chiave '$KEY_ALIAS', o la password è sbagliata."
            exit 1
          fi
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Firma con la chiave '$KEY_ALIAS', SHA-1 $SHA1"

      - name: Firebase config
        id: firebase
        if: ${{ inputs.platform == 'android' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "written=true" >> "$GITHUB_OUTPUT"
            echo "google-services.json dal secret GOOGLE_SERVICES_JSON."
          fi

      - name: Resolve Flutter SDK
        if: ${{ inputs.runner != 'github' }}
        env:
          FLUTTER_SDK: ${{ inputs.flutter_sdk }}
        run: |
          set -euo pipefail
          if [ ! -x "$FLUTTER_SDK/bin/flutter" ]; then
            echo "ERROR: nessun SDK Flutter eseguibile in $FLUTTER_SDK/bin/flutter."
            echo "Il runner deve avere un clone git dell SDK (la tarball ufficiale è solo x86-64)."
            exit 1
          fi
          echo "$FLUTTER_SDK/bin" >> "$GITHUB_PATH"

      # Worker, cache condivise della macchina e clear_cache di sola esecuzione: il pezzo
      # comune a tutte le build, in GabryXnLab/build-kit.
      - name: Tune build
        uses: GabryXnLab/build-kit/setup@main
        with:
          runner: ${{ inputs.runner }}
          max_workers: ${{ inputs.max_workers }}
          clear_cache: ${{ inputs.clear_cache }}

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v || true

      # L'AOT Android (release e profile) passa per `gen_snapshot`, e qui si scontra con
      # due limiti reali, misurati il 18 settembre 2026:
      #   1. Flutter pubblica `gen_snapshot` per host linux-x64 e NON per host linux-arm64:
      #      `…/<engine>/android-arm64-release/linux-arm64.zip` risponde 404 (la stessa URL
      #      con `linux-x64.zip` risponde 200). Nessun `flutter precache` lo risolve:
      #      l'artefatto non esiste a monte. Senza, la build muore con
      #      «Failed to find … /linux-arm64/gen_snapshot».
      #   2. Il binario x86-64 sotto il QEMU di sistema (8.2 di Ubuntu 24.04) muore con
      #      «QEMU internal SIGSEGV {code=MAPERR, addr=0x20}»; con QEMU 10 passa.
      # Dove Flutter cerca l'eseguibile si mette un wrapper che lancia quello x86-64 con un
      # emulatore utente. QEMU 10 impiega 316 s su Kagami, il 60% dell'intera build. Box64
      # (traduzione dinamica, libc nativa) ne impiega 46 con un app.so identico byte per
      # byte, a una condizione: che il garbage collector del Dart VM dentro gen_snapshot non
      # usi thread paralleli (--marker_tasks=1 --scavenger_tasks=1, niente marcatura e
      # spazzata concorrenti). Con i thread del GC e la CPU contesa — in CI Gradle compila
      # in parallelo all'AOT — Box64 cade in «double free or corruption» (riprodotto: 4 su 4
      # sotto carico, 0 su 3 con quelle opzioni). Con --deterministic l'output non dipende
      # dal GC. In più il wrapper compila due volte in parallelo con ambienti di dimensione
      # diversa e accetta l'app.so solo se entrambe riescono e coincidono, altrimenti QEMU:
      # una corruzione che cambi l'output senza far cadere il programma dovrebbe ripetersi
      # identica in due processi diversi, ed è ciò che rende sicuro il percorso veloce.
      # Costa una CPU in più per ~46 s. Opzioni che scrivono altri file → subito QEMU.
      # Scritto con un mv atomico perché l'SDK è condiviso dai runner della macchina.
      # `debug` non ci passa: è JIT e non usa `gen_snapshot`.
      - name: x86-64 emulator for gen_snapshot
        id: x86
        if: ${{ inputs.runner != 'github' && inputs.platform == 'android' && inputs.build_mode != 'debug' }}
        uses: GabryXnLab/build-kit/x86-64@main
        with:
          emulator: ${{ inputs.x86_emulator }}
          qemu_deb_url: ${{ inputs.qemu_deb_url }}

      - name: gen_snapshot per host ARM64
        if: ${{ steps.x86.outputs.launcher != '' }}
        env:
          FLUTTER_SDK: ${{ inputs.flutter_sdk }}
          BOX64: ${{ steps.x86.outputs.box64 }}
          QEMU: ${{ steps.x86.outputs.qemu }}
        run: |
          set -euo pipefail
          TEMPLATE="$RUNNER_TEMP/gen_snapshot.sh"
          cat > "$TEMPLATE" <<'WRAPPER'
          #!/bin/bash
          # Generato da flutter-ci (flutter-build.yml, «gen_snapshot per host ARM64»).
          GEN="$(dirname "$0")/../linux-x64/gen_snapshot"
          BOX64="__BOX64__"
          QEMU="__QEMU__"
          OUT=""
          for a in "$@"; do
            case "$a" in
              --elf=*) OUT="${a#--elf=}" ;;
              --save-*|--loading-unit*|--*manifest*) OUT=""; break ;;
            esac
          done
          if [ -n "$BOX64" ] && [ -n "$OUT" ]; then
            T=$(mktemp -d)
            F=$(basename "$OUT")
            run() {
              local dir=$1 pad=$2 a; shift 2
              local args=()
              for a in "$@"; do
                case "$a" in --elf=*) args+=("--elf=$dir/$F") ;; *) args+=("$a") ;; esac
              done
              mkdir -p "$dir"
              # GC del Dart VM senza thread paralleli: vedi il commento dello step.
              CI_LAYOUT_PAD="$pad" BOX64_LOG=0 BOX64_NOBANNER=1 "$BOX64" "$GEN" \
                --marker_tasks=1 --scavenger_tasks=1 --no-concurrent_mark --no-concurrent_sweep \
                "${args[@]}"
            }
            run "$T/a" x "$@" > "$T/a.log" 2>&1 &
            A=$!
            run "$T/b" "$(printf '%0512d' 0)" "$@" > "$T/b.log" 2>&1 &
            B=$!
            RA=0; RB=0
            wait "$A" || RA=$?
            wait "$B" || RB=$?
            if [ "$RA" = 0 ] && [ "$RB" = 0 ] && cmp -s "$T/a/$F" "$T/b/$F"; then
              cat "$T/a.log"
              mv -f "$T/a/$F" "$OUT"
              rm -rf "$T"
              echo "gen_snapshot: Box64, due esecuzioni concordi" >&2
              exit 0
            fi
            echo "gen_snapshot: Box64 non concorde (uscite $RA e $RB), ripeto con QEMU 10" >&2
            tail -n 3 "$T/a.log" "$T/b.log" >&2 || true
            rm -rf "$T"
          fi
          exec "$QEMU" "$GEN" "$@"
          WRAPPER
          ENGINE="$FLUTTER_SDK/bin/cache/artifacts/engine"
          FOUND=0
          for dir in "$ENGINE"/android-*-release "$ENGINE"/android-*-profile; do
            [ -d "$dir/linux-x64" ] || continue
            FOUND=$((FOUND+1))
            # Un `linux-arm64` che è un symlink alla cartella x86-64 è il fallback ingenuo:
            # fa eseguire il binario dal QEMU di sistema, che è quello che va in SIGSEGV.
            if [ -L "$dir/linux-arm64" ]; then rm -f "$dir/linux-arm64"; fi
            mkdir -p "$dir/linux-arm64"
            sed -e "s|__BOX64__|$BOX64|" -e "s|__QEMU__|$QEMU|" "$TEMPLATE" > "$dir/linux-arm64/gen_snapshot.new"
            chmod +x "$dir/linux-arm64/gen_snapshot.new"
            mv "$dir/linux-arm64/gen_snapshot.new" "$dir/linux-arm64/gen_snapshot"
          done
          if [ "$FOUND" = "0" ]; then
            echo "ERROR: in $ENGINE non c'è nessun android-*/linux-x64."
            echo "Scaricalo una volta sul runner con: flutter precache --android --universal"
            exit 1
          fi
          echo "gen_snapshot x86-64: ${BOX64:+Box64 verificato, }QEMU $QEMU ($FOUND cartelle dell'engine)"

      - name: Clear caches
        if: ${{ inputs.clear_cache == true }}
        run: |
          set -euo pipefail
          rm -rf build .dart_tool android/.gradle android/.kotlin android/app/build android/build
          echo "Cache di progetto svuotate (clear_cache=true)."

      # `flutter pub get`, mai `dart pub get`: in un progetto Flutter il secondo
      # risolve senza le dipendenze dell SDK e lascia un lockfile incoerente.
      - name: Install dependencies
        run: flutter pub get

      - name: Prepare project artifacts
        if: ${{ inputs.prepare_command != '' }}
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      - name: Generate code (build_runner)
        if: ${{ inputs.run_build_runner == true }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: ${{ inputs.run_analyze == true }}
        run: flutter analyze

      - name: Test
        if: ${{ inputs.run_tests == true }}
        run: flutter test

      - name: Build
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          ARTIFACT: ${{ inputs.artifact }}
          BUILD_MODE: ${{ inputs.build_mode }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
          SPLIT_PER_ABI: ${{ inputs.split_per_abi }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DART_DEFINES: ${{ inputs.dart_defines }}
          SECRET_DART_DEFINES: ${{ secrets.DART_DEFINES }}
        run: |
          set -euo pipefail
          # Ogni condizione è un `if` e non un `a && b`: con `set -e` una condizione
          # falsa in coda allo script farebbe uscire il job con exit 1.
          # Flutter non svuota le cartelle degli output, e sul self-hosted il checkout resta:
          # senza, un APK per ABI di un run precedente finirebbe fra gli artefatti di questo.
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/ios/ipa
          ARGS=("--${BUILD_MODE}")
          if [ -n "$BUILD_NAME" ]; then ARGS+=("--build-name=$BUILD_NAME"); fi
          if [ -n "$BUILD_NUMBER" ]; then ARGS+=("--build-number=$BUILD_NUMBER"); fi
          for d in $DART_DEFINES $SECRET_DART_DEFINES; do ARGS+=("--dart-define=$d"); done

          if [ "$PLATFORM" = "linux" ]; then
            flutter build linux "${ARGS[@]}"
          elif [ "$PLATFORM" = "ios" ]; then
            # Senza un account Apple Developer non c'è firma: l'app la firma chi la installa
            # (AltStore, Sideloadly) con il proprio Apple ID. I plugin li risolve Flutter (Swift
            # Package Manager, o `pod install` per quelli che non lo supportano).
            flutter build ios "${ARGS[@]}" --no-codesign
          else
            if [ -n "$TARGET_PLATFORM" ]; then ARGS+=("--target-platform=$TARGET_PLATFORM"); fi
            if [ "$ARTIFACT" = "aab" ]; then
              flutter build appbundle "${ARGS[@]}"
            else
              if [ "$SPLIT_PER_ABI" = "true" ]; then ARGS+=("--split-per-abi"); fi
              flutter build apk "${ARGS[@]}"
            fi
          fi

      # Il percorso dell'output dipende da piattaforma e formato: lo si risolve una
      # volta sola qui, così gli step di upload e di invio non lo ricalcolano.
      - name: Locate build output
        id: output
        env:
          PLATFORM: ${{ inputs.platform }}
          ARTIFACT: ${{ inputs.artifact }}
          BUILD_MODE: ${{ inputs.build_mode }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "linux" ]; then
            BUNDLE=$(find build/linux -maxdepth 3 -type d -name bundle | head -1)
            if [ -z "$BUNDLE" ]; then echo "ERROR: bundle Linux non trovato."; exit 1; fi
            # Un bundle è una cartella: per mandarlo su Telegram serve un file solo.
            TARBALL="$RUNNER_TEMP/${APP_NAME}-linux-${BUILD_MODE}.tar.gz"
            tar -czf "$TARBALL" -C "$(dirname "$BUNDLE")" "$(basename "$BUNDLE")"
            echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
            echo "upload=$BUNDLE" >> "$GITHUB_OUTPUT"
            FILE="$TARBALL"
          elif [ "$PLATFORM" = "ios" ]; then
            APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$APP" ]; then echo "ERROR: nessun .app in build/ios/iphoneos."; exit 1; fi
            # Un .ipa è uno zip con l'app in Payload/: la forma che AltStore e Sideloadly
            # aprono e firmano. -y tiene i symlink dei framework come symlink.
            FILE="build/ios/ipa/${APP_NAME}-ios-${BUILD_MODE}-unsigned.ipa"
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP" build/ios/ipa/Payload/
            (cd build/ios/ipa && zip -qry "$(basename "$FILE")" Payload)
            rm -rf build/ios/ipa/Payload
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
            echo "upload=$FILE" >> "$GITHUB_OUTPUT"
          elif [ "$ARTIFACT" = "aab" ]; then
            FILE=$(find build/app/outputs/bundle -name '*.aab' | head -1)
            if [ -z "$FILE" ]; then echo "ERROR: nessun .aab prodotto."; exit 1; fi
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
            echo "upload=build/app/outputs/bundle/**/*.aab" >> "$GITHUB_OUTPUT"
          else
            # Con split_per_abi sono più di uno: `path` li elenca uno per riga, come li
            # vogliono l'invio su Telegram e il controllo della firma.
            FILES=$(find build/app/outputs/flutter-apk -name '*.apk' | sort)
            if [ -z "$FILES" ]; then echo "ERROR: nessun .apk prodotto."; exit 1; fi
            FILE=$(head -1 <<< "$FILES")
            { echo "path<<PATHS"; echo "$FILES"; echo "PATHS"; } >> "$GITHUB_OUTPUT"
            echo "upload=build/app/outputs/flutter-apk/*.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -lh "$(dirname "$FILE")" || true

      # L'impronta di ogni file nel riepilogo, da registrare dove serve (Firebase, Google
      # Sign-In). Se la chiave dei secret c'era e la firma di una release è un'altra, il
      # progetto non legge android/key.properties: meglio fermarsi che consegnare un APK che
      # non si installa sopra il precedente. Debug e profile Gradle li firma con la sua chiave
      # di debug (lo schema di Flutter mette key.properties solo nel buildType release).
      - name: Signature
        if: ${{ inputs.platform == 'android' }}
        env:
          FILES: ${{ steps.output.outputs.path }}
          EXPECTED: ${{ inputs.build_mode == 'release' && steps.signing.outputs.sha256 || '' }}
        run: |
          set -euo pipefail
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          # Si confronta la SHA-256: apksigner la stampa sempre, la SHA-1 non in ogni versione.
          WANT=$(printf '%s' "$EXPECTED" | norm)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          { echo "### Firma"; echo "| File | SHA-1 | SHA-256 |"; echo "| --- | --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"
          WRONG=0
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            if [ "${f##*.}" = "apk" ]; then
              CERTS=$("$APKSIGNER" verify --print-certs "$f")
              SHA1=$(awk -F': ' '/certificate SHA-1 digest/ {print $2; exit}' <<< "$CERTS" | norm)
              SHA256=$(awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' <<< "$CERTS" | norm)
            else
              CERTS=$("${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -printcert -jarfile "$f")
              SHA1=$(awk '/SHA1:/ {print $2; exit}' <<< "$CERTS" | norm)
              SHA256=$(awk '/SHA256:/ {print $2; exit}' <<< "$CERTS" | norm)
            fi
            if [ -z "$SHA256" ]; then
              echo "$CERTS"
              echo "::error::$(basename "$f"): impronta della firma non trovata nell'output qui sopra."
              WRONG=1
              continue
            fi
            echo "| \`$(basename "$f")\` | \`$SHA1\` | \`$SHA256\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$f"): SHA-1 ${SHA1:-?}, SHA-256 $SHA256"
            if [ -n "$WANT" ] && [ "$SHA256" != "$WANT" ]; then
              echo "::error::$(basename "$f") è firmato con un'altra chiave (SHA-256 $SHA256, attesa $WANT): il build.gradle del progetto deve leggere android/key.properties."
              WRONG=1
            fi
          done <<< "$FILES"
          exit "$WRONG"

      # La quota di storage degli artifact è dell'org (piano free) e si ricalcola ogni 6-12 h:
      # quando è piena una build riuscita non deve risultare fallita. La consegna vera è il
      # file su Telegram; senza artifact manca solo il pulsante «Rimanda artefatti».
      # Un wrapper può chiamare il reusable due volte nello stesso run (per ABI e universale):
      # il nome dell'artifact deve distinguerle, o il secondo upload fallirebbe.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.app_name }}-${{ inputs.platform }}-${{ inputs.build_mode }}${{ inputs.split_per_abi && '-per-abi' || '' }}-${{ github.sha }}
          path: ${{ steps.output.outputs.upload }}
          retention-days: ${{ inputs.artifact_retention_days }}

      # Esito sempre (azione in GabryXnLab/build-kit, bot ci-bot): l'artefatto se il job riesce,
      # altrimenti il pulsante per rilanciare il run. Best-effort.
      - name: Notify via Telegram
        if: ${{ always() }}
        uses: GabryXnLab/build-kit/notify@main
        with:
          message_id: ${{ steps.started.outputs.message_id }}
          run_inputs: ${{ toJSON(github.event.inputs) }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ inputs.telegram_topic_id }}
          status: ${{ job.status }}
          title: ${{ inputs.app_name }} ${{ inputs.platform }} ${{ inputs.build_mode }}
          files: ${{ steps.output.outputs.path }}

      # Sul self-hosted il checkout resta fra i run: i file scritti dai secret non ci restano.
      - name: Remove files from secrets
        if: ${{ always() && (steps.signing.outputs.written == 'true' || steps.firebase.outputs.written == 'true') }}
        env:
          SIGNING: ${{ steps.signing.outputs.written }}
          FIREBASE: ${{ steps.firebase.outputs.written }}
        run: |
          if [ "$SIGNING" = "true" ]; then rm -f android/key.properties; fi
          if [ "$FIREBASE" = "true" ]; then rm -f android/app/google-services.json; fi
